# Local/CI settings: no AWS/Anthropic/Slack/GitHub calls are made by anything
# that loads this file. Used by `make test`, `cloudops kb build`, and the CLI.
environment: local
aws:
  region: ap-south-1
  accounts:
    - id: "000000000000"
      name: primary
      reader_role_arn: "arn:aws:iam::000000000000:role/cloudops-lite-reader"
      executor_role_arn: "arn:aws:iam::000000000000:role/cloudops-lite-executor"
storage:
  bucket: cloudops-lite-local
  state_table: cloudops-lite-state-local
  checkpoint_table: cloudops-lite-checkpoints-local
  parameter_prefix: /cloudops-lite/local
orchestration:
  max_groups_per_batch: 12
llm:
  provider: anthropic
  triage_model: claude-haiku-4-5-20251001
  reasoning_model: claude-sonnet-5
  max_cost_usd_per_run: 2.0
  max_cost_usd_per_month: 15.0
  requests_per_minute: 30
  max_concurrency: 3
  masking: true
  response_cache: true
  prices_per_mtok:
    claude-haiku-4-5-20251001: { in: 1.0, out: 5.0 }
    claude-sonnet-5: { in: 3.0, out: 15.0 }
kb:
  index_uri: ".cache/sop_index.json.gz"
  query_embeddings: none # titan | none — local/CI never calls Bedrock
  embedding_model_id: amazon.titan-embed-text-v2:0
  embedding_dimensions: 1024
  top_k: 5
  min_score: 0.3
checkpoint:
  backend: sqlite
collectors:
  security_hub: { enabled: true, min_severity: LOW }
  prowler: { enabled: true, prefix: prowler/latest/, max_age_days: 8 }
  access_analyzer: { enabled: true }
  cost_anomaly: { enabled: true, lookback_days: 14 }
  cost_explorer: { enabled: true, max_calls: 2 }
  cost_waste:
    enabled: true
    idle_cpu_threshold_pct: 5
    lookback_days: 7
    min_datapoint_hours: 1
    required_tags: [owner, cost-center, environment, application]
  drift:
    enabled: true
    prefix: drift/latest/
    max_age_days: 8
    workspaces:
      - name: orders-demo
        path: demo/infra
        state_key: demo/dev/terraform.tfstate
    unmanaged_selector: { tag: { app: orders-demo } }
  cloudtrail: { lookback_days: 8 }
refresh:
  prowler_workflow: prowler.yml
  drift_workflow: drift.yml
  max_wait_minutes: 30
remediation:
  terraform_pr: { enabled: true, allowed_paths: ["demo/infra/**"] }
  terraform_revert_dispatch: { enabled: true, workflow_file: demo-apply.yml }
  runbook_executor: { enabled: true, dry_run: true } # still zero real AWS calls -- dry_run stays true until a human flips it deliberately
approvals:
  slack_channel_id: "C0000000000"
  approvers: ["U0000000001", "U0000000002"]
  expiry_days: 7
github:
  auth_mode: pat
  owner: local
  repo: cloudops-agentic-orchestrator
report:
  presign_days: 7
  timezone: Asia/Kolkata
langsmith:
  project: cloudops-lite-local
  endpoint: "https://api.smith.langchain.com"
  anonymize: true
