repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: ^statemachine/review\.asl\.json$
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
        # ruff-format's markdown support reformats fenced ```python blocks —
        # desirable for docs we author, but BUILD_PROMPT.md is the original
        # build specification and must stay byte-identical to what it was given.
        exclude: ^BUILD_PROMPT\.md$

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
        exclude: ^infra/bootstrap/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (src/ strict)
        entry: uv run mypy
        language: system
        types: [python]
        files: ^src/cloudops_orchestrator/
        pass_filenames: false
