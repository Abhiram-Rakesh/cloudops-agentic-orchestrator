name: kb-sync

on:
  push:
    branches: [main]
    paths: ["knowledge_base/**"]
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: kb-sync-${{ github.workflow }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  kb-sync:
    name: build + upload SOP knowledge base index
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true

      - name: uv sync
        run: uv sync --frozen --all-extras

      - name: cloudops kb validate
        run: uv run cloudops kb validate

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.KB_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: resolve config env vars
        # config/settings.dev.yaml interpolates these ${VAR} placeholders at
        # load time (config.py::_interpolate) -- kb build (unlike kb
        # validate, which doesn't load this file) fails fast with
        # "Missing required environment variables" without them.
        run: |
          echo "AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"
          echo "ARTIFACT_BUCKET=${{ vars.NAME_PREFIX }}-$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"
          echo "SLACK_CHANNEL_ID=${{ vars.SLACK_CHANNEL_ID }}" >> "$GITHUB_ENV"
          echo "APPROVER_SLACK_ID=$(echo '${{ vars.APPROVER_SLACK_IDS }}' | jq -r '.[0]')" >> "$GITHUB_ENV"
          echo "GH_OWNER=${{ github.repository_owner }}" >> "$GITHUB_ENV"
          echo "REPO_NAME=${{ github.event.repository.name }}" >> "$GITHUB_ENV"

      - name: cloudops kb build --embeddings titan --upload
        run: uv run cloudops kb build --embeddings titan --upload --config config/settings.dev.yaml
