name: demo-plan

on:
  pull_request:
    paths: ["demo/**"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: demo-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  plan:
    name: fmt/validate/tflint + plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: "v0.49.0"

      - name: terraform fmt -check
        working-directory: demo/infra
        run: terraform fmt -check -recursive .

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEMO_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        working-directory: demo/infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="region=${{ env.AWS_REGION }}"

      - name: terraform validate
        working-directory: demo/infra
        run: terraform validate

      - name: tflint
        working-directory: demo/infra
        run: |
          tflint --init
          tflint

      - name: terraform plan
        working-directory: demo/infra
        run: terraform plan -lock=false -no-color -out=tfplan.bin | tee plan_output.txt

      - name: Comment the plan on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('demo/infra/plan_output.txt', 'utf8').slice(0, 60000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### \`terraform plan\` — demo/infra\n\n\`\`\`\n${plan}\n\`\`\``,
            });

      - name: Mark an agent draft PR ready for review
        if: >
          success() &&
          startsWith(github.head_ref, 'cloudops/') &&
          github.event.pull_request.draft == true
        run: gh pr ready "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
