version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels: ["dependencies", "python"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "ci"]

  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "terraform"]

  - package-ecosystem: "terraform"
    directory: "/demo/infra"
    schedule:
      interval: "weekly"
    labels: ["dependencies", "terraform", "demo"]
