[project]
name = "cloudops-orchestrator"
version = "0.1.0"
description = "Free-plan LangGraph multi-agent CloudOps orchestrator: security, cost & drift with human-approved remediation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "CloudOps Agentic Orchestrator" }]

dependencies = [
  "langgraph==1.2.12",
  "langgraph-checkpoint-aws==1.2.3",
  "langchain-core==1.6.5",
  "langchain-anthropic==1.7.4",
  "langsmith==0.14.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pyyaml==6.0.3",
  "python-frontmatter==1.3.0",
  "jinja2==3.1.6",
  "structlog==26.1.0",
  "tenacity==9.1.4",
  "httpx==0.28.1",
  "slack-sdk==3.44.1",
  "githubkit==0.16.1",
  "python-hcl2==8.1.4",
  "aws-embedded-metrics==3.5.0",
  "boto3==1.43.103",
]

[project.optional-dependencies]
cli = [
  "typer==0.27.2",
  "rich==15.0.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "moto[all]==5.2.3",
  "ruff==0.16.9",
  "mypy==2.3.1",
  "boto3-stubs[dynamodb,s3,lambda,stepfunctions,ssm,scheduler,sns,cloudwatch,ce,securityhub,guardduty,config,accessanalyzer,sts,cloudtrail,compute-optimizer]==1.43.103",
  "types-PyYAML==6.0.12.20250915",
  "freezegun==1.5.5",
  "respx==0.23.1",
  "langgraph-checkpoint-sqlite==3.1.1",
]

[project.scripts]
cloudops = "cloudops_orchestrator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops_orchestrator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cloudops_orchestrator"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["cloudops_orchestrator"]
mypy_path = "src"
exclude = ["^src/cloudops_orchestrator/handlers/"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_anthropic.*", "githubkit.*", "hcl2.*", "aws_embedded_metrics.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: tests that exercise moto/respx-backed integrations",
]

[tool.coverage.run]
source = ["src/cloudops_orchestrator"]
omit = ["src/cloudops_orchestrator/handlers/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
