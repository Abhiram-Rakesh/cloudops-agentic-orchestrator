# Single source of truth for the demo stack's intentional SOP violations.
#
# Every row says: given this resource/finding, which clause(s) should the
# agent cite, what action_type + parameters should it recommend, and what
# risk tier should the policy engine land on. `scripts/gen_demo_artifacts.py`
# generates fixture JSON (tests/fixtures/scenario_demo/{prowler,securityhub,
# drift}/*.json) and demo/docs/VIOLATIONS.md from this file — nowhere else.
# A test asserts every `expected_clause_ids` entry here exists in
# `knowledge_base/`.
#
# `post_clickops` rows only apply after `make drift` (simulate_clickops.sh)
# has run; they are absent from the initial `demo-up` state.
#
# Tags common to every compliant demo resource (see demo/README.md):
# owner=orders-team, cost-center=CC-2040, environment=dev, application=orders,
# app=orders-demo, managed-by=terraform. Each violation below is a
# *deviation* from this compliant baseline.

cases:
  # --- orders-demo-vpc ---
  - resource_name: orders-demo-vpc
    resource_type: AwsEc2Vpc
    domain: security
    source: security_hub
    rule_id: EC2.6
    control_ids: [EC2.6]
    expected_clause_ids: [SEC-002-2.3]
    expected_action_type: manual_ticket
    expected_tier: T1
    iac_managed: true
    environment: dev
    notes: "No VPC Flow Logs configured"

  - resource_name: orders-demo-vpc-default-sg
    resource_type: AwsEc2SecurityGroup
    domain: security
    source: security_hub
    rule_id: EC2.2
    control_ids: [EC2.2]
    expected_clause_ids: [SEC-002-2.2]
    expected_action_type: manual_ticket
    expected_tier: T1
    iac_managed: false
    environment: dev
    notes: "Default VPC security group left at AWS default (unmanaged by Terraform)"

  # --- orders-demo-web-admin-sg ---
  - resource_name: orders-demo-web-admin-sg
    resource_type: AwsEc2SecurityGroup
    domain: security
    source: security_hub
    rule_id: EC2.13
    control_ids: [EC2.13, EC2.14, CIS-5.2, CIS-5.3]
    expected_clause_ids: [SEC-002-2.1]
    expected_action_type: ssm_automation
    expected_action_document: CloudOps-RevokeSGIngressWorld
    expected_tier: T1
    iac_managed: true
    environment: dev
    internet_exposed: true
    notes: "Ingress tcp/22 from 0.0.0.0/0"

  # --- orders-demo-app-sg (compliant at demo-up; drift target) ---
  - resource_name: orders-demo-app-sg
    domain: drift
    source: drift
    id: post_clickops
    resource_type: AwsEc2SecurityGroup
    rule_id: DRIFT-ATTR
    control_ids: [DRIFT-ATTR]
    expected_clause_ids: [DRIFT-003-3.1]
    expected_action_type: terraform_revert_dispatch
    expected_tier: T1
    iac_managed: true
    environment: dev
    internet_exposed: true
    notes: "simulate_clickops.sh step 1: authorizes tcp/8080 from 0.0.0.0/0 — security-weakening, unticketed -> revert"

