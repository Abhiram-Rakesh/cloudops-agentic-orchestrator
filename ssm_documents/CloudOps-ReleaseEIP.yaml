# CloudOps-ReleaseEIP (§9.3) — COST-class remediation.
# Releases an unassociated Elastic IP. Default tier T1 per
# config/policy/action_allowlist.yaml.
#
# VERIFY BEFORE DEPLOY: see CloudOps-EnableS3BlockPublicAccess.yaml's note.
schemaVersion: "0.3"
description: "Release an unassociated Elastic IP, unless tagged cloudops:protected=true."
assumeRole: "{{ AutomationAssumeRole }}"
parameters:
  AutomationAssumeRole:
    type: String
    description: "ARN of the role Automation assumes to perform these actions."
  AllocationId:
    type: String
    description: "The Elastic IP allocation to release."
mainSteps:
  - name: CheckProtectedTag
    action: aws:executeScript
    isCritical: true
    inputs:
      Runtime: python3.11
      Handler: check_protected
      InputPayload:
        ResourceId: "{{ AllocationId }}"
      Script: |-
        import boto3

        def check_protected(events, context):
            client = boto3.client("ec2")
            response = client.describe_tags(
                Filters=[{"Name": "resource-id", "Values": [events["ResourceId"]]}]
            )
            protected = any(
                t["Key"] == "cloudops:protected" and t["Value"] == "true"
                for t in response.get("Tags", [])
            )
            return {"protected": "true" if protected else "false"}
    outputs:
      - Name: Protected
        Selector: $.Payload.protected
        Type: String
  - name: AbortIfProtected
    action: aws:branch
    inputs:
      Choices:
        - NextStep: VerifyUnassociated
          Variable: "{{ CheckProtectedTag.Protected }}"
          StringEquals: "false"
      Default: AbortedProtectedResource
  - name: VerifyUnassociated
    action: aws:executeScript
    inputs:
      Runtime: python3.11
      Handler: verify_unassociated
      InputPayload:
        AllocationId: "{{ AllocationId }}"
      Script: |-
        import boto3

        def verify_unassociated(events, context):
            client = boto3.client("ec2")
            addresses = client.describe_addresses(AllocationIds=[events["AllocationId"]])["Addresses"]
            associated = bool(addresses) and "AssociationId" in addresses[0]
            return {"associated": "true" if associated else "false"}
    outputs:
      - Name: Associated
        Selector: $.Payload.associated
        Type: String
  - name: AbortIfAssociated
    action: aws:branch
    inputs:
      Choices:
        - NextStep: ReleaseEIP
          Variable: "{{ VerifyUnassociated.Associated }}"
          StringEquals: "false"
      Default: AbortedNowAssociated
  - name: ReleaseEIP
    action: aws:executeAwsApi
    isEnd: true
    inputs:
      Service: ec2
      Api: ReleaseAddress
      AllocationId: "{{ AllocationId }}"
  - name: AbortedProtectedResource
    action: aws:sleep
    isEnd: true
    inputs:
      Duration: PT1S
  - name: AbortedNowAssociated
    action: aws:sleep
    isEnd: true
    inputs:
      Duration: PT1S
